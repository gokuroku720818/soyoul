<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소율이의 마법공주 수학대전 v3</title>
<style>
:root{--navy:#102554;--ice:#dff8ff;--pink:#ff75b9;--gold:#ffd257;--glass:#ffffffdf}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;color:#102554;background:#bdeeff;min-height:100vh}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.game{min-height:100vh;background:linear-gradient(#5ebff8 0 48%,#d9f6ff 49% 100%);position:relative;overflow:hidden}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 78% 12%,#fff 0 1%,transparent 16%),linear-gradient(155deg,transparent 58%,#ffffff55 59% 61%,transparent 62%);pointer-events:none}
.snow{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(#fff 2px,transparent 3px);background-size:45px 45px;animation:snow 12s linear infinite}@keyframes snow{to{background-position:90px 180px}}
.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0d3476e8;color:white;box-shadow:0 3px 12px #001b4c55}
.logo{font-weight:1000;font-size:clamp(17px,3vw,29px);text-shadow:0 2px #16306e}.stats{display:flex;gap:7px}.pill{background:#ffffff20;border:2px solid #ffffff55;border-radius:18px;padding:6px 10px;font-weight:900}
.world{position:relative;z-index:1;max-width:1000px;margin:auto;height:430px;padding:18px}.castle{position:absolute;right:8%;top:35px;font-size:120px;opacity:.38;filter:drop-shadow(0 8px 5px #4678b8)}
.princess{position:absolute;left:5%;bottom:15px;width:245px;height:330px;filter:drop-shadow(0 12px 10px #1c4d7d55);transform-origin:bottom center}
.princess svg{width:100%;height:100%;overflow:visible}.pet{position:absolute;left:27%;bottom:45px;font-size:54px;filter:drop-shadow(0 4px 3px #3456)}
.enemy{position:absolute;right:9%;bottom:45px;text-align:center}.enemySprite{font-size:105px;filter:drop-shadow(0 7px 4px #1235)}
.hp{width:190px;height:18px;background:#243968;border:3px solid white;border-radius:20px;overflow:hidden}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff6a79,#ffbd56);transition:.3s}.enemyName{font-weight:1000;font-size:18px;color:white;text-shadow:0 2px 3px #123;margin-bottom:5px}
.combo{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:30px;font-weight:1000;color:#ffdb45;text-shadow:0 3px #a84973}
.fx{position:absolute;left:29%;top:45%;font-size:68px;opacity:0}.blast{animation:blast .68s ease-out}@keyframes blast{0%{opacity:1;transform:translate(0) scale(.5) rotate(0)}70%{opacity:1;transform:translate(350px,-35px) scale(1.6) rotate(220deg)}100%{opacity:0;transform:translate(430px) scale(2.2) rotate(360deg)}}.hit{animation:hit .35s}@keyframes hit{25%{transform:translateX(18px) rotate(8deg)}50%{transform:translateX(-18px) rotate(-8deg)}}.cast{animation:cast .5s}@keyframes cast{50%{transform:translateY(-18px) rotate(-2deg)}}
.quiz{position:relative;z-index:3;max-width:760px;margin:-58px auto 18px;background:var(--glass);backdrop-filter:blur(10px);border:4px solid white;border-radius:26px;padding:15px;box-shadow:0 12px 35px #17396c44;text-align:center}.type{font-weight:900;color:#3286d2}.q{font-size:42px;font-weight:1000;margin:3px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ans{border:3px solid #b8d9f7;border-radius:17px;background:white;padding:13px;font-size:27px;font-weight:1000;color:#14356c;box-shadow:0 4px #9ebbd5}.ans:active{transform:translateY(3px);box-shadow:0 1px #9ebbd5}.ans.good{background:#9cf0c8}.ans.bad{background:#ffb2c3}.msg{min-height:26px;margin-top:9px;font-weight:900;color:#8450b9}
.menu{position:fixed;left:10px;top:76px;z-index:7;display:flex;flex-direction:column;gap:7px}.menu button{border:2px solid #ffffff55;background:#123b78e8;color:white;border-radius:14px;padding:10px;font-weight:900}.menu button.active{background:#63bff7}
.modal{position:fixed;inset:0;background:#08204dcc;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.hidden{display:none}.shop{width:min(960px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#dff6ff,#c7eaff);border:4px solid white;border-radius:28px;padding:18px;box-shadow:0 20px 60px #001b55aa}.shopHead{display:flex;justify-content:space-between;align-items:center}.shop h2{font-size:30px;margin:0}.close{border:0;background:#183b77;color:white;border-radius:50%;width:42px;height:42px;font-size:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.card{background:white;border:3px solid #b8ddfa;border-radius:20px;padding:10px;text-align:center}.card.equipped{border-color:#ffd45c;box-shadow:0 0 0 3px #fff2a5}.miniDress{height:130px;width:100px;margin:auto;clip-path:polygon(38% 0,62% 0,70% 25%,96% 100%,4% 100%,30% 25%);border:3px solid #fff;filter:drop-shadow(0 5px 4px #2344)}.card h3{margin:5px 0}.buy{width:100%;border:0;border-radius:13px;padding:9px;background:linear-gradient(#ff8bc5,#ed5ca6);color:white;font-weight:1000}.buy.owned{background:linear-gradient(#62bff6,#398bd7)}.price{font-weight:1000;color:#bd7c00;margin:4px}.startCard{max-width:480px;background:white;border-radius:28px;padding:28px;text-align:center;border:4px solid #c9eeff}.primary{width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(135deg,#62bff6,#b768ed);color:white;font-size:20px;font-weight:1000}
@media(max-width:700px){.menu{position:relative;left:auto;top:auto;flex-direction:row;padding:7px;background:#0d3476}.menu button{flex:1;padding:7px 5px;font-size:13px}.world{height:365px}.princess{left:-15px;width:205px;height:290px}.enemy{right:2%;transform:scale(.8);transform-origin:bottom right}.pet{left:31%;font-size:42px}.quiz{margin:-42px 8px 10px}.cards{grid-template-columns:repeat(2,1fr)}.q{font-size:36px}.castle{font-size:85px}.stats{gap:3px}.pill{padding:5px 7px}}
</style>
</head>
<body>
<div class="game">
<div class="sky"></div><div class="snow"></div>
<header class="top"><div class="logo">❄️ 소율이의 마법공주 수학대전</div><div class="stats"><div class="pill">Lv.<span id="lv">1</span></div><div class="pill">⭐ <span id="stars">0</span></div></div></header>
<nav class="menu"><button class="active">⚔️ 전투</button><button id="shopBtn">👗 상점</button><button id="modeBtn">➕✖️ 혼합</button><button id="soundBtn">🔊 소리</button></nav>
<section class="world">
<div class="castle">🏰</div><div class="combo" id="combo"></div>
<div class="princess" id="princess">
<svg id="princessSvg" viewBox="0 0 260 360" aria-label="얼음 마법 공주">
<defs>
 <linearGradient id="hairG" x1="0" x2="1"><stop stop-color="#fffdf1"/><stop offset=".55" stop-color="#f2e9c9"/><stop offset="1" stop-color="#d7c99f"/></linearGradient>
 <linearGradient id="dressG" x1="0" y1="0" x2="1" y2="1"><stop id="dressA" stop-color="#e5fbff"/><stop id="dressB" offset=".52" stop-color="#54bdea"/><stop id="dressC" offset="1" stop-color="#b9f0ff"/></linearGradient>
 <linearGradient id="capeG"><stop stop-color="#eaffff" stop-opacity=".85"/><stop offset="1" stop-color="#8ee8ff" stop-opacity=".2"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- cape -->
<path d="M94 170 Q45 245 48 342 Q102 326 130 286 Q160 330 218 343 Q212 246 166 171Z" fill="url(#capeG)" stroke="#fff" stroke-width="3"/>
<!-- hair back -->
<path d="M73 68 Q62 112 72 177 Q60 218 89 248 Q104 210 105 166 L157 166 Q157 221 181 250 Q204 213 190 173 Q202 107 181 68Z" fill="url(#hairG)" stroke="#d8cba5" stroke-width="3"/>
<!-- neck -->
<path d="M116 145 L115 174 Q130 188 146 174 L144 145Z" fill="#ffd9c7"/>
<!-- face -->
<ellipse cx="130" cy="112" rx="48" ry="55" fill="#ffe0cf" stroke="#f3c7b5" stroke-width="2"/>
<!-- ears -->
<ellipse cx="81" cy="115" rx="8" ry="13" fill="#ffd9c7"/><ellipse cx="179" cy="115" rx="8" ry="13" fill="#ffd9c7"/>
<!-- front hair -->
<path d="M84 103 Q77 51 126 49 Q177 45 182 101 Q166 79 143 69 Q119 90 84 103Z" fill="url(#hairG)" stroke="#d8cba5" stroke-width="2"/>
<path d="M144 66 Q165 88 166 125" fill="none" stroke="#efe5c8" stroke-width="10" stroke-linecap="round"/>
<!-- brows -->
<path d="M98 104 Q109 98 119 104M142 104 Q153 98 163 104" fill="none" stroke="#b28f78" stroke-width="3" stroke-linecap="round"/>
<!-- eyes -->
<ellipse cx="109" cy="116" rx="10" ry="12" fill="#fff"/><ellipse cx="151" cy="116" rx="10" ry="12" fill="#fff"/>
<ellipse cx="110" cy="117" rx="6.5" ry="8" fill="#59aee8"/><ellipse cx="150" cy="117" rx="6.5" ry="8" fill="#59aee8"/>
<circle cx="111" cy="118" r="3.4" fill="#19375f"/><circle cx="149" cy="118" r="3.4" fill="#19375f"/>
<circle cx="113" cy="114" r="2" fill="#fff"/><circle cx="151" cy="114" r="2" fill="#fff"/>
<!-- nose / smile -->
<path d="M129 119 Q126 132 132 132" fill="none" stroke="#e5ae9e" stroke-width="2"/>
<path d="M116 143 Q130 153 145 142" fill="#f39aaa" stroke="#cc7487" stroke-width="2"/>
<!-- blush -->
<ellipse cx="96" cy="137" rx="10" ry="5" fill="#f6a9ae" opacity=".35"/><ellipse cx="164" cy="137" rx="10" ry="5" fill="#f6a9ae" opacity=".35"/>
<!-- crown -->
<path d="M102 59 L108 35 L124 50 L134 28 L147 50 L163 35 L160 62Z" fill="#bff5ff" stroke="#fff" stroke-width="3" filter="url(#glow)"/><circle cx="134" cy="43" r="5" fill="#70d8ff"/>
<!-- arms -->
<path d="M103 185 Q82 205 70 245" fill="none" stroke="#ffd9c7" stroke-width="16" stroke-linecap="round"/>
<path d="M157 185 Q181 202 194 233" fill="none" stroke="#ffd9c7" stroke-width="16" stroke-linecap="round"/>
<!-- dress bodice -->
<path d="M105 170 Q130 184 155 170 L171 218 L89 218Z" fill="url(#dressG)" stroke="#fff" stroke-width="3"/>
<!-- skirt -->
<path d="M91 211 Q130 224 169 211 Q198 268 207 344 L53 344 Q64 266 91 211Z" fill="url(#dressG)" stroke="#fff" stroke-width="4"/>
<!-- dress details -->
<path d="M83 253 Q130 270 178 253M70 298 Q130 316 191 298" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
<g id="dressOrnaments" fill="#fff" filter="url(#glow)"><text x="112" y="240" font-size="28">❄</text><text x="82" y="290" font-size="17">✦</text><text x="157" y="305" font-size="20">❄</text><text x="119" y="330" font-size="17">✧</text></g>
<!-- wand -->
<g transform="translate(192 228) rotate(-25)" filter="url(#glow)"><rect x="-4" y="0" width="8" height="82" rx="4" fill="#d8b06a"/><path d="M0 -22 L7 -7 L23 -5 L11 6 L15 22 L0 13 L-15 22 L-11 6 L-23 -5 L-7 -7Z" fill="#eaffff" stroke="#73d9ff" stroke-width="3"/></g>
</svg>
</div>
<div class="pet">🐱</div>
<div class="enemy"><div class="enemyName" id="enemyName"></div><div class="hp"><i id="enemyHp"></i></div><div class="enemySprite" id="enemy"></div></div>
<div class="fx" id="fx">❄️</div>
</section>
<section class="quiz"><div class="type" id="type"></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="msg" id="msg">정답을 골라 마법을 발사하세요!</div></section>
</div>
<div class="modal" id="start"><div class="startCard"><h1>❄️ 소율이의 마법공주 수학대전</h1><p>덧셈과 곱셈으로 몬스터를 물리치고<br>⭐ 별 50개를 모아 예쁜 드레스를 사세요!</p><button class="primary" id="play">모험 시작!</button></div></div>
<div class="modal hidden" id="shopModal"><div class="shop"><div class="shopHead"><div><h2>👗 드레스 상점</h2><b>보유 별 ⭐ <span id="shopStars">0</span></b></div><button class="close" id="closeShop">✕</button></div><p>드레스는 모두 ⭐50개! 구매하면 바로 자동으로 입어요.</p><div class="cards" id="cards"></div></div></div>
<div class="modal hidden" id="win"><div class="startCard"><h1>🎁 승리!</h1><p id="winText"></p><button class="primary" id="next">다음 몬스터!</button></div></div>
<script>
(()=>{
const $=x=>document.getElementById(x);
const dresses=[
{id:'ice',name:'하늘빛 드레스',c:['#e5fbff','#54bdea','#b9f0ff'],bg:'linear-gradient(135deg,#e5fbff,#54bdea,#b9f0ff)'},
{id:'cherry',name:'벚꽃 드레스',c:['#ffe1ef','#ff83bb','#ffd2e8'],bg:'linear-gradient(135deg,#ffe1ef,#ff83bb,#ffd2e8)'},
{id:'star',name:'별빛 드레스',c:['#eadcff','#8b65e8','#c7a8ff'],bg:'linear-gradient(135deg,#eadcff,#8b65e8,#c7a8ff)'},
{id:'gold',name:'황금 드레스',c:['#fff3b5','#e8ad35','#ffe49a'],bg:'linear-gradient(135deg,#fff3b5,#e8ad35,#ffe49a)'},
{id:'aurora',name:'오로라 드레스',c:['#ffbce7','#86e5e5','#9e8cff'],bg:'linear-gradient(135deg,#ffbce7,#86e5e5,#9e8cff)'},
{id:'queen',name:'얼음여왕 드레스',c:['#ffffff','#9bdcff','#d9c7ff'],bg:'linear-gradient(135deg,#fff,#9bdcff,#d9c7ff)'}];
const mons=[['얼음 슬라임','🧊',70],['눈꽃 토끼','🐰',90],['숲의 유령','👻',110],['마법 골렘','🗿',140],['설산 괴수','👹',170],['드래곤 대왕','🐲',220]];
let s=JSON.parse(localStorage.getItem('mathPrincessV2')||'null')||{stars:0,lv:1,xp:0,stage:1,combo:0,mode:'mix',owned:['ice'],equipped:'ice'};
if(!s.owned)s.owned=['ice']; if(!s.equipped)s.equipped='ice'; if(typeof s.sound==='undefined')s.sound=true;
let answer=0,enemyHp=70,enemyMax=70,locked=false,currentFx='❄️',audio=null;
function save(){localStorage.setItem('mathPrincessV2',JSON.stringify(s))}
function audioCtx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function playTone(freq=440,dur=.12,type='sine',gain=.06,delay=0){if(!s.sound)return;let a=audioCtx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}
function sound(name){if(!s.sound)return;if(name==='click')playTone(620,.06,'sine',.035);if(name==='wrong'){playTone(220,.13,'square',.04);playTone(165,.18,'square',.03,.12)}if(name==='correct'){playTone(660,.09,'sine',.05);playTone(880,.12,'sine',.05,.08)}if(name==='magic'){playTone(520,.18,'triangle',.04);playTone(1040,.25,'sine',.045,.08)}if(name==='hit')playTone(115,.12,'sawtooth',.05);if(name==='combo'){[523,659,784,1047].forEach((f,i)=>playTone(f,.16,'triangle',.05,i*.07))}if(name==='fanfare'){[523,659,784,1047,1319].forEach((f,i)=>playTone(f,.22,'triangle',.055,i*.11))}}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function md(){return mons[(s.stage-1)%mons.length]}
function applyDress(){let d=dresses.find(x=>x.id===s.equipped)||dresses[0];$('dressA').setAttribute('stop-color',d.c[0]);$('dressB').setAttribute('stop-color',d.c[1]);$('dressC').setAttribute('stop-color',d.c[2])}
function setup(){let m=md();enemyMax=m[2]+Math.floor((s.stage-1)/6)*25;enemyHp=enemyMax;$('enemyName').textContent=m[0];$('enemy').textContent=m[1];applyDress();update();question()}
function question(){locked=false;let mul=s.mode==='mul'||(s.mode==='mix'&&Math.random()<.45),a,b;if(mul){let cap=Math.min(2+Math.floor(s.stage/2),9);a=rnd(2,Math.max(2,cap));b=rnd(1,9);answer=a*b;$('question').textContent=`${a} × ${b} = ?`;$('type').textContent='⚡ 곱셈 마법';currentFx='⚡'}else{let cap=Math.min(10+s.stage*3,50);a=rnd(1,cap);b=rnd(1,cap);answer=a+b;$('question').textContent=`${a} + ${b} = ?`;$('type').textContent='❄️ 덧셈 마법';currentFx='❄️'}let set=new Set([answer]);while(set.size<3){let d=rnd(-5,5);if(d&&answer+d>0)set.add(answer+d)}$('answers').innerHTML='';[...set].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>choose(v,b);$('answers').appendChild(b)})}
function choose(v,b){if(locked)return;sound('click');if(v!==answer){b.classList.add('bad');s.combo=0;$('msg').textContent='조금 아쉬워요! 다시 골라보세요 💗';sound('wrong');update();return}locked=true;b.classList.add('good');s.combo++;let dmg=28+Math.min(5,s.combo)*4;if(s.combo>=5)dmg+=22;s.stars+=s.combo>=5?3:1;s.xp+=10;if(s.xp>=100){s.xp-=100;s.lv++}$('msg').textContent=s.combo>=5?'🌈 별빛 필살기! 정답이에요!':'✨ 정답! 마법 발사!';sound('correct');setTimeout(()=>sound(s.combo>=5?'combo':'magic'),80);$('princess').classList.add('cast');$('fx').textContent=s.combo>=5?'🌟':currentFx;$('fx').classList.remove('blast');void $('fx').offsetWidth;$('fx').classList.add('blast');setTimeout(()=>{$('enemy').classList.add('hit');sound('hit');enemyHp=Math.max(0,enemyHp-dmg);update()},420);setTimeout(()=>{$('enemy').classList.remove('hit');$('princess').classList.remove('cast');enemyHp<=0?victory():question()},800);save()}
function victory(){s.stars+=10;s.stage++;save();update();sound('fanfare');$('winText').innerHTML=`몬스터를 물리쳤어요!<br><b>⭐ 10개 보너스!</b>`;$('win').classList.remove('hidden')}
function update(){$('lv').textContent=s.lv;$('stars').textContent=s.stars;$('shopStars').textContent=s.stars;$('enemyHp').style.width=(enemyHp/enemyMax*100)+'%';$('combo').textContent=s.combo>=2?`🔥 ${s.combo} COMBO!`:'';$('modeBtn').textContent=s.mode==='add'?'➕ 덧셈':s.mode==='mul'?'✖️ 곱셈':'➕✖️ 혼합';$('soundBtn').textContent=s.sound?'🔊 소리':'🔇 음소거';applyDress()}
function renderShop(){$('cards').innerHTML='';dresses.forEach(d=>{let owned=s.owned.includes(d.id),eq=s.equipped===d.id,c=document.createElement('div');c.className='card'+(eq?' equipped':'');c.innerHTML=`<div class="miniDress" style="background:${d.bg}"></div><h3>${d.name}</h3><div class="price">${d.id==='ice'?'기본 의상':'⭐ 50'}</div><button class="buy ${owned?'owned':''}">${eq?'장착 중!':owned?'입기':'구매하기'}</button>`;c.querySelector('button').onclick=()=>{sound('click');if(eq)return;if(owned){s.equipped=d.id}else if(s.stars>=50){s.stars-=50;s.owned.push(d.id);s.equipped=d.id;sound('fanfare')}else{alert('별이 부족해요! ⭐50개를 모아주세요.');sound('wrong');return}save();update();renderShop()};$('cards').appendChild(c)})}
$('play').onclick=()=>{audioCtx();sound('fanfare');$('start').classList.add('hidden');setup()};
$('shopBtn').onclick=()=>{sound('click');renderShop();$('shopModal').classList.remove('hidden')};$('closeShop').onclick=()=>{sound('click');$('shopModal').classList.add('hidden')};
$('next').onclick=()=>{sound('click');$('win').classList.add('hidden');setup()};
$('modeBtn').onclick=()=>{sound('click');s.mode=s.mode==='mix'?'add':s.mode==='add'?'mul':'mix';save();update();question()};
$('soundBtn').onclick=()=>{s.sound=!s.sound;save();update();if(s.sound)sound('correct')};
applyDress();update();
})();
</script>
</body>
</html>
